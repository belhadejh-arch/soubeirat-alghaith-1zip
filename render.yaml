services:
  - type: web
    name: soubeirat-api
    runtime: node
    # Root Directory فارغ = جذر المونوريبو
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: soubeirat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app   # غيّر هذا بعد نشر Vercel

databases:
  - name: soubeirat-db
    databaseName: soubeirat
    plan: free
