services:
  - type: web
    name: soubeirat-api
    runtime: node
    # Root of the monorepo — pnpm workspaces are resolved from here
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build
    # Run DB schema push first, then start the server
    startCommand: pnpm --filter @workspace/db run push && node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      # Render assigns PORT=10000 for web services
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      # Set this in the Render dashboard to your Neon connection string
      - key: NEON_DATABASE_URL
        sync: false
      # Auto-generated 32-byte random secret for JWT signing
      - key: JWT_SECRET
        generateValue: true
      # Set this in the Render dashboard (same SESSION_SECRET you already have)
      - key: SESSION_SECRET
        sync: false
      # Comma-separated list of allowed CORS origins.
      # Set to your Vercel app URL, e.g.: https://soubeirat.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
